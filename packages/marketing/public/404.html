<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClientPad</title>
<meta name="robots" content="noindex">
<script>
  (function () {
    const path = window.location.pathname;
    const host = window.location.hostname;
    const normalized = path === "/" ? "/index.html" : path === "/docs" ? "/docs/index.html" : `${path.replace(/\/+$/, "")}.html`;
    if (host === "docs.clientpad.xyz" || path.startsWith("/docs")) {
      window.location.replace(normalized);
      return;
    }
    window.location.replace(normalized);
  })();
</script>
</head>
<body><script type="module" src="/site.js"></script>
</body>
</html>
